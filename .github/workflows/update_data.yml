name: ⚡ Update 51Bitquant Dynamic ATR Strategy Data  # 工作流名稱

on:
  schedule:
    # 📌 台北時間 (UTC+8) 平日 4H 週期更新對照 (對應 UTC 02:00, 06:00, 10:00, 14:00, 18:00, 22:00)：
    - cron: '0 2,6,10,14,18 * * 1-5'  # 盤中定時排程
    - cron: '0 22 * * 0-4'  # 早盤開盤排程

  workflow_dispatch:  # 允許手動從 GitHub Actions 介面觸發

jobs:
  update-data:
    runs-on: ubuntu-latest  # 使用 Ubuntu 執行環境
    permissions:
      contents: write  # 賦予 GITHUB_TOKEN 推送與寫入權限
    timeout-minutes: 30  # 最長執行 30 分鐘

    steps:
      - name: ⬇️ Checkout repository  # 拉取最新程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 使用自動 Token

      - name: 🐍 Set up Python 3.11  # 安裝 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # 快取套件

      - name: 📦 Install dependencies  # 安裝依賴庫
        run: pip install -r requirements.txt  # 安裝 requirements.txt

      - name: 🔄 Run strategy update  # 執行自適應策略回測與資料更新
        run: python gold_adaptive_strategy.py  # 抓取最新資料並更新 strategy_results.json
        env:
          PYTHONUNBUFFERED: '1'  # 即時輸出 log

      # ⚠️ 必須接著執行長期回測：gold_adaptive_strategy.py 會「完整覆寫」strategy_results.json，
      #    而 metrics_4yr 是由 run_4yr_backtest.py 事後補寫進去的。若略過此步，
      #    每次排程更新都會把長期回測資料刪除，導致網頁的長期壓力測試卡片沒有資料。
      - name: 🌐 Run long-period backtest  # 執行長期回測並補寫 metrics_4yr
        run: python run_4yr_backtest.py  # 讀取 strategy_results.json 並加入 metrics_4yr
        env:
          PYTHONUNBUFFERED: '1'  # 即時輸出 log

      - name: ✅ Verify results integrity  # 驗證 JSON 完整性，避免推送殘缺資料
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('strategy_results.json'))
          missing = [k for k in ('current_status', 'metrics', 'metrics_4yr', 'completed_trades') if k not in d]
          if missing:
              print(f"::error::strategy_results.json 缺少必要欄位: {missing}")
              sys.exit(1)
          if 'rolling_performance' not in d['metrics']:
              print("::error::metrics 缺少 rolling_performance")
              sys.exit(1)
          print(f"✅ 驗證通過: 短期 {d['metrics']['total_trades']} 筆 / 長期 {d['metrics_4yr']['total_trades']} 筆")
          PY

      # ⚠️ tvDatafeed 對 TradingView 的抓取偶爾會在 GitHub-hosted Runner 上被限流/封鎖而靜默失敗，
      #    此時 download_data() 會退回本地舊快取，之後的 diff 判定為「無變更」而跳過 commit，
      #    導致資料陳舊卻無任何錯誤訊息 (曾發生連續 3 天未察覺)。此步驟明確計算資料新鮮度，
      #    只要判斷得出「這是新資料」就不算失敗；只有在明顯陳舊 (數個交易日未變) 時才示警。
      - name: 🕐 Check data freshness  # 檢查資料新鮮度，陳舊時發出明顯警示
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          d = json.load(open('strategy_results.json'))
          last_str = d['current_status']['last_updated']
          last_naive = datetime.strptime(last_str, '%Y-%m-%d %H:%M:%S')  # 資料時間戳記本身為 UTC+8 (台北時間)
          from datetime import timedelta
          last = (last_naive - timedelta(hours=8)).replace(tzinfo=timezone.utc)  # 換算為真正的 UTC 以正確比較
          now = datetime.now(timezone.utc)
          age_hours = (now - last).total_seconds() / 3600
          # 黃金週末休市約 48 小時 (五收六日不開盤至日開盤)，故以 60 小時為警戒線，
          # 平日應每 4~8 小時更新一次，超過 60 小時代表排程很可能已連續失敗多次
          if age_hours > 60:
              print(f"::warning::策略資料已 {age_hours:.1f} 小時未更新 (最後更新: {last_str})，"
                    f"tvDatafeed 可能在此 Runner 上被限流/封鎖，請人工檢查或改用本機手動刷新")
          else:
              print(f"✅ 資料新鮮度正常：最後更新於 {age_hours:.1f} 小時前 ({last_str})")
          PY

      - name: 📊 Check if data changed  # 檢查檔案是否變更
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain strategy_results.json pepperstone_xauusd_4h.csv pepperstone_xauusd_daily.csv pepperstone_usdx_daily.csv)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Commit and push updated data  # 若有變更則自動推送
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add strategy_results.json pepperstone_xauusd_4h.csv pepperstone_xauusd_daily.csv pepperstone_usdx_daily.csv backtest_equity_curve_adaptive.png all_trades_detail_adaptive.csv backtest_equity_curve_4yr_adaptive.png all_trades_4yr_adaptive.csv
          git commit -m "🤖 Auto-update: 51Bitquant ATR Strategy Data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: ✅ No changes detected  # 無變更提示
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "資料無更新，跳過 commit。"
